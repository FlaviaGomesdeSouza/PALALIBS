<text x="236.0" y="162.0" font-size="15" fill="#7b3fe4">laser (LA) / LIBS</text>
<line x1="668.2" y1="261.0" x2="784" y2="201.0" stroke="#222" stroke-width="1"/><circle cx="668.2" cy="261.0" r="2.5" fill="#222"/>
<text x="790" y="206.0" font-size="16">Borda de 0,6 mm do próprio corpo:</text>
<text x="790" y="226.0" font-size="16">segura 0,8 mm da beirada da pastilha</text>
<line x1="735.3" y1="267.6" x2="784" y2="262.6" stroke="#222" stroke-width="1"/><circle cx="735.3" cy="267.6" r="2.5" fill="#222"/>
<text x="790" y="267.6" font-size="16">Plano de referência: as faces encostam</text>
<text x="790" y="287.6" font-size="16">na borda, qualquer que seja a espessura</text>
<line x1="695.7" y1="382.0" x2="784" y2="333.0" stroke="#222" stroke-width="1"/><circle cx="695.7" cy="382.0" r="2.5" fill="#222"/>
<text x="790" y="338.0" font-size="16">Corpo (impresso de cabeça para baixo:</text>
<text x="790" y="358.0" font-size="16">a borda sai lisa e plana, direto da mesa)</text>
<line x1="468.0" y1="322.6" x2="784" y2="394.6" stroke="#222" stroke-width="1"/><circle cx="468.0" cy="322.6" r="2.5" fill="#222"/>
<text x="790" y="399.6" font-size="16">Pistão com pino-guia</text>
<line x1="596.7" y1="404.0" x2="784" y2="434.2" stroke="#222" stroke-width="1"/><circle cx="596.7" cy="404.0" r="2.5" fill="#222"/>
<text x="790" y="439.2" font-size="16">Mola leve (fio 0,3 mm): ~0,2–0,4 N</text>
<line x1="567.0" y1="468.9" x2="784" y2="478.2" stroke="#222" stroke-width="1"/><circle cx="567.0" cy="468.9" r="2.5" fill="#222"/>
<text x="790" y="483.2" font-size="16">Placa de molas: pino-guia embaixo da mola;</text>
<text x="790" y="503.2" font-size="16">não gira (2 pinos travam no corpo)</text>
<line x1="686.9" y1="517.3" x2="784" y2="526.6" stroke="#222" stroke-width="1"/><circle cx="686.9" cy="517.3" r="2.5" fill="#222"/>
<text x="790" y="531.6" font-size="16">Fundo com baioneta: gira ~35° por baixo da placa</text>
<text x="30" y="588.8" font-size="16" font-weight="bold">Montagem:</text>
<text x="30" y="612.8" font-size="16" >1. Vire o corpo de cabeça para baixo e coloque cada pastilha com a face de análise para baixo (ela apoia na borda).</text>
<text x="30" y="636.8" font-size="16" >2. Coloque o pistão (pino para cima), a mola sobre o pino e a placa de molas (pinos nos furos do corpo).</text>
<text x="30" y="660.8" font-size="16" >3. Encaixe o fundo com as garras nos rasgos, empurre e gire ~35° no sentido HORÁRIO (olhando para o fundo) até o clique. Vire o conjunto.</text>
<text x="30" y="684.8" font-size="16" >A mola fica encaixada nas duas pontas. Só o fundo gira, e ele desliza sob a placa, sem arrastar as molas.</text>
</svg>