<text x="790" y="201.6" font-size="16">Borda de 0,6 mm do próprio corpo:</text>
<text x="790" y="221.6" font-size="16">segura 0,8 mm da beirada da pastilha</text>
<line x1="735.3" y1="263.2" x2="784" y2="258.2" stroke="#222" stroke-width="1"/><circle cx="735.3" cy="263.2" r="2.5" fill="#222"/>
<text x="790" y="263.2" font-size="16">Plano de referência: as faces encostam</text>
<text x="790" y="283.2" font-size="16">na borda, qualquer que seja a espessura</text>
<line x1="695.7" y1="382.0" x2="784" y2="328.6" stroke="#222" stroke-width="1"/><circle cx="695.7" cy="382.0" r="2.5" fill="#222"/>
<text x="790" y="333.6" font-size="16">Corpo (impresso de cabeça para baixo:</text>
<text x="790" y="353.6" font-size="16">a borda sai lisa e plana, direto da mesa)</text>
<line x1="468.0" y1="318.2" x2="784" y2="390.2" stroke="#222" stroke-width="1"/><circle cx="468.0" cy="318.2" r="2.5" fill="#222"/>
<text x="790" y="395.2" font-size="16">Pistão com pino-guia</text>
<line x1="596.7" y1="404.0" x2="784" y2="429.8" stroke="#222" stroke-width="1"/><circle cx="596.7" cy="404.0" r="2.5" fill="#222"/>
<text x="790" y="434.8" font-size="16">Mola leve (fio 0,3 mm): ~0,2–0,4 N</text>
<line x1="642.9" y1="504.1" x2="784" y2="473.8" stroke="#222" stroke-width="1"/><circle cx="642.9" cy="504.1" r="2.5" fill="#222"/>
<text x="790" y="478.8" font-size="16">Fundo com baioneta: gira ~35° e trava</text>
<text x="30" y="571.2" font-size="16" font-weight="bold">Montagem:</text>
<text x="30" y="595.2" font-size="16" >1. Vire o corpo de cabeça para baixo e coloque cada pastilha com a face de análise para baixo (ela apoia na borda).</text>
<text x="30" y="619.2" font-size="16" >2. Coloque o pistão (pino para cima) e a mola sobre o pino.</text>
<text x="30" y="643.2" font-size="16" >3. Encaixe o fundo com as garras nos rasgos, empurre e gire ~35° no sentido HORÁRIO (olhando para o fundo) até o clique. Vire o conjunto.</text>
<text x="30" y="667.2" font-size="16" >Nada gira sobre a face da pastilha: só o fundo gira, e ele toca apenas as molas.</text>
</svg>