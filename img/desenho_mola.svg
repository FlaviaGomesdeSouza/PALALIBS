<text x="760" y="118.0" font-size="16">Tampa parafusada (2 × M3 escareado)</text>
<line x1="614.0" y1="204.0" x2="754" y2="157.0" stroke="#222" stroke-width="1"/><circle cx="614.0" cy="204.0" r="2.5" fill="#222"/>
<text x="760" y="162.0" font-size="16">Borda da janela (0,8 mm): a pastilha é</text>
<text x="760" y="182.0" font-size="16">empurrada contra ela</text>
<line x1="683.0" y1="210.0" x2="754" y2="215.0" stroke="#222" stroke-width="1"/><circle cx="683.0" cy="210.0" r="2.5" fill="#222"/>
<text x="760" y="220.0" font-size="16">Plano de referência: as duas faces</text>
<text x="760" y="240.0" font-size="16">ficam aqui, mesmo com espessuras diferentes</text>
<line x1="440.0" y1="260.0" x2="754" y2="277.0" stroke="#222" stroke-width="1"/><circle cx="440.0" cy="260.0" r="2.5" fill="#222"/>
<text x="760" y="282.0" font-size="16">Pistão com pino-guia (impresso)</text>
<line x1="556.0" y1="340.0" x2="754" y2="317.0" stroke="#222" stroke-width="1"/><circle cx="556.0" cy="340.0" r="2.5" fill="#222"/>
<text x="760" y="322.0" font-size="16">Mola de compressão inox</text>
<text x="760" y="342.0" font-size="16">(Ø 6 mm, livre 10 mm)</text>
<line x1="592.0" y1="294.0" x2="754" y2="369.0" stroke="#222" stroke-width="1"/><circle cx="592.0" cy="294.0" r="2.5" fill="#222"/>
<text x="760" y="374.0" font-size="16">A mola empurra a pastilha para cima</text>
<line x1="500.0" y1="420.0" x2="754" y2="409.0" stroke="#222" stroke-width="1"/><circle cx="500.0" cy="420.0" r="2.5" fill="#222"/>
<text x="760" y="414.0" font-size="16">Respiro (Ø 1,5 mm): deixa o poço purgar</text>
<text x="30" y="470.0" font-size="16" font-weight="bold">Montagem:</text>
<text x="30" y="494.0" font-size="16" >1. Coloque a mola no poço, o pistão por cima (pino para baixo) e a pastilha com a face para cima.</text>
<text x="30" y="518.0" font-size="16" >2. Encaixe a tampa: as pastilhas sobem até a borda das janelas.</text>
<text x="30" y="542.0" font-size="16" >3. Aperte os 2 parafusos da tampa até encostar. Pronto: sem ajuste de altura.</text>
<text x="30" y="566.0" font-size="16" >Para trocar a pastilha, solte a tampa: a mola levanta a pastilha e ela sai fácil.</text>
